<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=ㅇ, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        margin: 0;
      }
      .container {
        width: 1000px;
        background-color: orange;
        height: 600px;
      }
      .header {
        background-color: aqua;
        /* 부모의 너비를 100%를 갖는다 */
        width: 100%;
        height: 100px;
      }
      .body-wrap {
        /*  */
        display: flex;
        width: 100%;
        height: 400px;
        border: 1px solid black;
      }
      .body-wrap .left-menu {
        background-color: darkcyan;
        width: 30%;
        heigh/: 100%;
      }
      .body-wrap .right {
        background-color: red;
        width: 70%;
        height: 100%;
      }
    .footer{
        background-color: gray;
        width: 100%;
        height: 100px;
    }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- 꼭대기 층 -->
      <div class="header"></div>
      <!-- 중간 층 -->
      <div class="body-wrap">
        <!-- 중간 - 왼쪽 -->
        <div class="left-menu"></div>
        <!-- 중간 - 오른쪽 -->
        <div class="right"></div>
      </div>
      <!-- 맨 아레 -->
      <div class="footer"></div>
    </div>
  </body>
</html>
